  <path d="M43 33 L19 56 L42 96 Z" stroke="#ffffff" stroke-width="1.35" stroke-opacity="0.8" />
  <path d="M57 33 L81 56 L58 96 Z" stroke="#ffffff" stroke-width="1.35" stroke-opacity="0.8" />

